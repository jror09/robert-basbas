<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.B — Creative Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;background:#0e0e10}
body{overflow:hidden}

/* ---------- theme variables ---------- */
.rb-portfolio{
  --px:0;--py:0;--ex:0;--ey:0;
  --bg:#eff0f2;--fg:#17181b;--muted:#5c6068;--line:#00000025;--accent:#555c68;
  --title-grad:#171b23 5%,#778190 45%,#292f3a 75%;
  --nav-bg:#eff0f366;
  --photo-grad:#d4d7dd,#b5bbc6;
  --robot-bg:radial-gradient(circle at 35% 20%,#f1f2f3,#bfc2c6);
  --contour:#424b59;--contour-op:.7;
  --orb-bg:radial-gradient(circle,transparent 48%,#414d6330 61%,#303c5238 62%,transparent 64%);
  --orb-ring:#3c485550;--orb-dot:#58657a;--orb-op:.85;
  --overlay:linear-gradient(90deg,#eff0f244,transparent 70%),radial-gradient(ellipse at 90% 25%,#8b94a530,transparent 65%);
  --bubble:#f0f1f3;
  --tag-bg:#4e5662;--tag-fg:#f4f5f7;
  --cta-bg:#343a44;--cta-fg:#f5f6f8;
  --topic-bg:#ffffff40;--topic-first-fg:#f3f4f7;
  --parent-bg:#ffffff35;
  --ripple:#45536b;
  --cur-bg:#303744;--cur-clk:#252a32;--cur-border:#00000022;--cur-fg:#f4f6f9;
  --canvas:0;
}
.rb-portfolio.rb-dark{
  --bg:#0e0e10;--fg:#f1f2f4;--muted:#a4a7ae;--line:#ffffff24;--accent:#d3d7df;
  --title-grad:#f9fafc 5%,#8d95a3 45%,#e9edf5 75%;
  --nav-bg:#17181a66;
  --photo-grad:#2a2c31,#17191c;
  --robot-bg:radial-gradient(circle at 35% 20%,#505359,#222426);
  --contour:#a5adbb;--contour-op:.38;
  --orb-bg:radial-gradient(circle,transparent 48%,#a8b2c512 61%,#dce2ee16 62%,transparent 64%);
  --orb-ring:#bdc6d31b;--orb-dot:#dce2eb;--orb-op:.7;
  --overlay:linear-gradient(90deg,#0e0e1055,transparent 65%),radial-gradient(ellipse at 80% 0%,#aab2c212,transparent 60%);
  --bubble:#25272c;
  --tag-bg:#cbd0da;--tag-fg:#15161a;
  --cta-bg:linear-gradient(135deg,#f1f2f5,#9da4af);--cta-fg:#141518;
  --topic-bg:#1c1e2399;--topic-first-fg:#17181b;
  --parent-bg:#ffffff05;
  --ripple:#aeb6c4;
  --cur-bg:#dce1eb;--cur-clk:#edf0f5;--cur-border:#ffffff55;--cur-fg:#171a20;
}

/* ---------- root ---------- */
.rb-portfolio{width:100%;height:100dvh;min-height:560px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;transition:background .5s,color .5s;isolation:isolate;outline:none}
.rb-portfolio *{box-sizing:border-box}
.rb-portfolio h1,.rb-portfolio h2,.rb-portfolio p{margin:0}

/* ---------- original design CSS ---------- */
@media(hover:hover) and (pointer:fine){.rb-portfolio.rb-custom-cursor,.rb-portfolio.rb-custom-cursor *{cursor:none!important}}.rb-portfolio .rb-cursor{display:none}@media(hover:hover) and (pointer:fine){.rb-portfolio .rb-cursor{display:block}}
.rb-portfolio .rb-title span{background:linear-gradient(115deg,var(--title-grad));background-size:200% 100%;background-clip:text;-webkit-background-clip:text;color:transparent!important}.rb-portfolio .rb-title:hover span{background-position:100% 50%}.rb-portfolio .rb-title{font-weight:400!important}.rb-portfolio .rb-nav{backdrop-filter:blur(20px);background:var(--nav-bg);box-shadow:inset 0 1px 0 #ffffff10}.rb-portfolio .rb-photo{background:linear-gradient(140deg,var(--photo-grad))!important}.rb-portfolio .rb-topic:hover{box-shadow:0 25px 55px #0003,inset 0 1px 0 #ffffff30!important}
.rb-portfolio button{position:relative;overflow:hidden;transition:background .3s,transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}.rb-portfolio button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff25 50%,transparent 75%);transform:translateX(-120%);transition:transform .65s;pointer-events:none}.rb-portfolio button:hover::after{transform:translateX(120%)}.rb-portfolio button:active{transform:translateY(0) scale(.96)!important}.rb-portfolio button:disabled{pointer-events:none}.rb-portfolio .rb-photo{transition:box-shadow .5s,border-color .4s}.rb-portfolio .rb-photo:hover{box-shadow:0 22px 55px #0003,0 0 0 1px #d3d7df70;border-color:#cbd0da!important}.rb-portfolio .rb-photo img{transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}.rb-portfolio .rb-photo:hover img{transform:scale(1.06);filter:saturate(1.12)}.rb-portfolio .rb-topic:hover{transform:translateY(-10px) rotate(-1deg)!important;box-shadow:0 24px 50px #0002}.rb-portfolio .rb-topic span{transition:transform .4s}.rb-portfolio .rb-topic:hover span:last-child{transform:translateX(8px)}.rb-portfolio .rb-title span{display:inline-block;transition:text-shadow .4s,transform .4s}.rb-portfolio .rb-title:hover span{transform:translateX(6px);text-shadow:0 0 35px #d3d7df40}.rb-portfolio button:hover{background:#aeb6c420!important;border-color:#cbd0da!important;transform:translateY(-4px);box-shadow:0 8px 25px #aeb6c418}.rb-portfolio button:focus-visible{outline:2px solid #cbd0da;outline-offset:5px}.rb-portfolio .rb-grid{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:8vw}.rb-portfolio .rb-title{font-size:clamp(44px,6.8vw,96px);line-height:1.03;letter-spacing:-.065em;font-weight:500}.rb-portfolio .rb-main{position:absolute;inset:140px 7% 108px;display:flex;align-items:center}.rb-portfolio .rb-nav{display:flex;gap:5px;padding:5px;border:1px solid var(--line);border-radius:100px}.rb-portfolio .rb-top{position:absolute;left:3.3%;right:3.3%;top:27px;display:flex;align-items:center;justify-content:space-between;z-index:3}.rb-portfolio .rb-portrait{height:min(53vh,490px);border-radius:110px 12px 12px 12px;transform:rotate(3deg)}.rb-portfolio .rb-topics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.rb-portfolio .rb-topic{backdrop-filter:blur(14px);height:240px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.rb-portfolio .rb-parentphotos{display:grid;grid-template-columns:1fr 1fr;gap:18px}.rb-portfolio .rb-footer{position:absolute;bottom:29px;left:3.3%;right:3.3%;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.4px;color:var(--muted)}
@media(max-width:700px){.rb-portfolio .rb-fact-bubble{width:145px!important;padding:9px 11px!important}.rb-portfolio .rb-fact-bubble p{font-size:10px!important}.rb-portfolio .rb-top{gap:8px}.rb-portfolio .rb-top>button{padding:10px 12px!important;font-size:10px!important}.rb-portfolio .rb-top{top:12px;align-items:flex-start}.rb-portfolio .rb-nav{position:absolute;top:76px;left:0;right:0;justify-content:center}.rb-portfolio .rb-nav button{padding:10px 12px!important;font-size:10px!important}.rb-portfolio .rb-main{inset:145px 7% 80px}.rb-portfolio .rb-grid{gap:24px;grid-template-columns:1fr 0.85fr}.rb-portfolio .rb-title{font-size:42px}.rb-portfolio .rb-portrait{height:280px;border-radius:65px 10px 10px 10px}.rb-portfolio .rb-topics{grid-template-columns:1fr 1fr;gap:10px}.rb-portfolio .rb-topic{height:150px}.rb-portfolio .rb-detail{grid-template-columns:1fr!important}.rb-portfolio .rb-detail .rb-detailphoto{display:none}.rb-portfolio .rb-footer{font-size:9px}.rb-portfolio .rb-hide{display:none}.rb-portfolio .rb-parentphotos>div>.rb-photo{height:150px!important}.rb-portfolio .rb-parentphotos{gap:12px}}
.rb-portfolio.rb-chapter-open .rb-top,.rb-portfolio.rb-chapter-open .rb-footer{display:none}.rb-portfolio.rb-chapter-open .rb-main{inset:0;padding:40px 7%;overflow-y:auto;align-items:safe center}.rb-portfolio.rb-chapter-open .rb-main>section{max-width:1440px;margin:auto}.rb-portfolio.rb-chapter-open .rb-detail{min-height:65dvh;gap:7vw!important}.rb-portfolio.rb-chapter-open .rb-detail p{max-width:620px!important;font-size:clamp(18px,2vw,26px)!important}.rb-portfolio.rb-chapter-open .rb-detailphoto .rb-photo{height:60dvh!important}.rb-portfolio.rb-chapter-open .rb-detail>div>div{flex-wrap:wrap}
@media(max-width:700px){.rb-portfolio.rb-chapter-open .rb-main{inset:0;padding:28px 7%;align-items:flex-start}.rb-portfolio.rb-chapter-open .rb-detail{min-height:0;gap:28px!important}.rb-portfolio.rb-chapter-open .rb-detail .rb-detailphoto{display:block}.rb-portfolio.rb-chapter-open .rb-detailphoto .rb-photo{height:32dvh!important}}
@media(prefers-reduced-motion:reduce){.rb-portfolio button:hover,.rb-portfolio .rb-topic:hover,.rb-portfolio .rb-photo:hover img,.rb-portfolio .rb-title:hover span{transform:none!important}.rb-portfolio *{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- shared pieces ---------- */
.rb-portfolio .rb-btn{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:100px;padding:13px 22px;cursor:pointer;font:inherit;font-size:12px}
.rb-portfolio .rb-photo{border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center}
.rb-portfolio .rb-photo img{width:100%;height:100%;object-fit:cover}
.rb-portfolio .rb-label{font-size:10px;letter-spacing:3px;color:var(--accent)}
.rb-portfolio .rb-navbtn{border:0;padding:12px 19px;background:transparent;color:var(--muted)}
.rb-portfolio .rb-navbtn.on{background:var(--fg);color:var(--bg)}
.rb-portfolio .rb-pill{padding:8px 16px;font-size:11px;background:transparent;color:var(--muted)}
.rb-portfolio .rb-pill.on{background:var(--fg);color:var(--bg)}
.rb-portfolio .rb-topic{border-radius:16px;padding:24px;background:var(--topic-bg);color:var(--fg)}
.rb-portfolio .rb-topic.first{background:var(--accent);color:var(--topic-first-fg)}
.rb-portfolio .rb-dot{border:0;height:4px;width:20px;padding:0;border-radius:4px;background:var(--line);cursor:pointer}
.rb-portfolio .rb-dot.on{width:48px;background:var(--accent)}

/* ---------- background layers ---------- */
.rb-portfolio .rb-contours{position:absolute;inset:0;pointer-events:none;overflow:hidden;transform:translate(calc(var(--px)*18px),calc(var(--py)*12px)) rotate(var(--cr,0deg));transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.rb-portfolio .rb-contours svg{opacity:var(--contour-op);display:block}
.rb-portfolio.tab-1{--cr:3deg}.rb-portfolio.tab-2{--cr:6deg}.rb-portfolio.tab-3{--cr:9deg}
.rb-portfolio .rb-orb{position:absolute;width:70vw;height:70vw;pointer-events:none;opacity:var(--orb-op);right:-12%;top:3%;--os:1;--or:0deg;transform:translate(calc(var(--px)*24px),calc(var(--py)*16px)) scale(var(--os)) rotate(var(--or));transition:right 1.8s cubic-bezier(.2,.9,.2,1),top 1.8s cubic-bezier(.2,.9,.2,1),transform 1.8s cubic-bezier(.2,.9,.2,1),opacity .5s}
.rb-portfolio.tab-1 .rb-orb{right:22%;top:-36%;--os:1.18;--or:-32deg}
.rb-portfolio.tab-2 .rb-orb{right:-3%;top:-15%;--os:.82;--or:38deg}
.rb-portfolio.tab-3 .rb-orb{right:36%;top:12%;--os:.92;--or:-18deg}
.rb-portfolio .rb-orb-glow{position:absolute;inset:8%;border-radius:50%;background:var(--orb-bg)}
.rb-portfolio .rb-ring{position:absolute;border:1px solid var(--orb-ring);border-radius:50%;animation:rb-spin linear infinite}
.rb-portfolio .rb-ring.rev{animation-direction:reverse}
.rb-portfolio .rb-ring i{position:absolute;top:14.5%;left:14.5%;border-radius:8px;background:var(--orb-dot);box-shadow:0 0 16px #dce2eb77}
@keyframes rb-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rb-portfolio .rb-ring{transform:rotateX(55deg)}}
.rb-portfolio .rb-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rb-portfolio .rb-overlay{position:absolute;inset:0;pointer-events:none;background:var(--overlay)}
.rb-portfolio .rb-ripples{position:absolute;inset:0;pointer-events:none}
.rb-portfolio .rb-ripple{position:absolute;width:400px;height:400px;border-radius:50%;border:1px solid var(--ripple);pointer-events:none}

/* ---------- robot ---------- */
.rb-portfolio .rb-robot-btn{padding:0;border:0;border-radius:16px;display:block}
.rb-portfolio .rb-robot{width:68px;height:68px;position:relative;perspective:350px;border-radius:50%;background:var(--robot-bg);overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff3,0 6px 18px #0003;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.rb-portfolio .rb-robot:hover{transform:scale(1.12) rotate(-4deg)}
.rb-portfolio .rb-robot:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){.rb-portfolio .rb-robot:hover,.rb-portfolio .rb-robot:active{transform:none}}
.rb-portfolio .rb-float{position:absolute;inset:0;animation:rb-float 3s ease-in-out infinite}
@keyframes rb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.rb-portfolio .rb-body{position:absolute;bottom:-9px;left:10px;width:48px;height:34px;border-radius:50% 50% 0 0;background:linear-gradient(120deg,#d6d8db,#92969c);transform:translateX(calc(var(--px)*2px)) rotate(calc(var(--px)*3deg));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.rb-portfolio .rb-outfit-slot,.rb-portfolio .rb-hat-slot{position:absolute;inset:0;pointer-events:none}
.rb-portfolio .rb-outfit{position:absolute;inset:0;border-radius:50% 50% 0 0;background:#aeb4bc;animation:rb-pop .5s cubic-bezier(.3,1.4,.5,1) both}
.rb-portfolio .rb-outfit.t1{background:#252a32}.rb-portfolio .rb-outfit.t2{background:#25272c}.rb-portfolio .rb-outfit.t3{background:#b7bec8}
@keyframes rb-pop{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}
.rb-portfolio .rb-hat{position:absolute;inset:0;animation:rb-hat .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes rb-hat{from{opacity:0;transform:translateY(-16px) rotate(-18deg)}to{opacity:1;transform:none}}
.rb-portfolio .rb-head{position:absolute;top:13px;left:20px;width:29px;height:31px;border-radius:43% 43% 48% 48%;background:linear-gradient(130deg,#f0f1f3,#a5aab1);box-shadow:inset 1px 1px 2px #fff9,inset -3px -3px 6px #0002,0 3px 5px #0003;transform:translate(calc(var(--px)*4px),calc(var(--py)*2px)) rotateX(calc(var(--py)*-14deg)) rotateY(calc(var(--px)*24deg)) scale(1);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rb-portfolio.tab-3 .rb-head{transform:translate(calc(var(--px)*4px),calc(var(--py)*2px)) rotateX(calc(var(--py)*-14deg)) rotateY(calc(var(--px)*24deg)) scale(.88)}
.rb-portfolio .rb-ear{position:absolute;top:11px;width:4px;height:10px;border-radius:4px;background:#a4aab1}
.rb-portfolio .rb-ear.l{left:-3px}.rb-portfolio .rb-ear.r{right:-3px}
.rb-portfolio .rb-visor{position:absolute;top:9px;left:4px;right:4px;height:13px;border-radius:7px;background:linear-gradient(#20282e,#101619);display:flex;justify-content:space-around;align-items:center;padding:0 2px}
.rb-portfolio .rb-eye{width:4px;height:5px;border-radius:4px;background:#e8f0f5;box-shadow:0 0 6px #e8f0f580;transform-origin:center;translate:calc(var(--ex)*1px) calc(var(--ey)*1px);animation:rb-blink 4.6s infinite}
.rb-portfolio.tab-3 .rb-eye{height:6px}
@keyframes rb-blink{0%,42%{transform:scaleY(1)}45%{transform:scaleY(.12)}48%,100%{transform:scaleY(1)}}
.rb-portfolio .rb-mouth{position:absolute;bottom:4px;left:11px;width:7px;height:2px;border-radius:5px;background:#626c77;transition:all .2s}
.rb-portfolio.tab-3 .rb-mouth{width:9px;height:4px;border-radius:0 0 8px 8px}
.rb-portfolio.rb-talking .rb-mouth{animation:rb-talk .9s infinite;transition:none}
.rb-portfolio.rb-talking.tab-3 .rb-mouth{border-radius:0 0 8px 8px}
@keyframes rb-talk{0%,100%{width:7px;height:2px}25%{width:10px;height:5px}50%{width:6px;height:2px}75%{width:9px;height:4px}}
.rb-portfolio .rb-tassel{position:absolute;top:14px;right:-9px;width:5px;height:7px;border-radius:2px;background:var(--accent);transform-origin:top;animation:rb-sway 2s ease-in-out infinite}
@keyframes rb-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.rb-portfolio .rb-glow{position:absolute;top:-9px;left:11px;width:6px;height:4px;border-radius:4px;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:rb-pulse 2s ease-in-out infinite}
@keyframes rb-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.rb-portfolio .rb-fact-bubble{position:relative;width:260px;padding:13px 16px;border:1px solid var(--line);border-radius:16px 16px 16px 4px;background:var(--bubble);box-shadow:0 8px 24px #0002}
.rb-portfolio .rb-fact-bubble .rb-arrow{position:absolute;left:-6px;top:27px;width:10px;height:10px;transform:rotate(45deg);background:var(--bubble);border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.rb-portfolio .rb-fact-bubble p{font-size:11px;line-height:1.6;color:var(--fg)}

/* ---------- home portrait ---------- */
.rb-portfolio .rb-portrait-wrap{position:relative;width:min(100%,345px);justify-self:center;transform:perspective(1000px) translateY(calc(var(--py)*-5px)) rotateY(calc(var(--px)*4deg)) rotateX(calc(var(--py)*-3deg));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.rb-portfolio .rb-portrait-wrap:hover{transform:perspective(1000px) translateY(calc(var(--py)*-5px - 10px)) rotate(-2deg) rotateY(calc(var(--px)*4deg)) rotateX(calc(var(--py)*-3deg)) scale(1.015)}
@media(prefers-reduced-motion:reduce){.rb-portfolio .rb-portrait-wrap,.rb-portfolio .rb-portrait-wrap:hover{transform:none}}
.rb-portfolio .rb-flip{width:100%;aspect-ratio:.75;perspective:1200px;border-radius:100px 16px 16px 16px}
.rb-portfolio .rb-flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.22,1,.36,1)}
.rb-portfolio .rb-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rb-portfolio .rb-parent{min-width:0;animation:rb-rise .5s both}
@keyframes rb-rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- custom cursor ---------- */
.rb-portfolio .rb-cursor{position:absolute;left:0;top:0;z-index:30;pointer-events:none;opacity:0}
.rb-portfolio .rb-cdot{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:4px;transform:translate(-50%,-50%) scale(1);background:var(--cur-bg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #0003;border:1px solid var(--cur-border);overflow:hidden;transition:width .28s cubic-bezier(.3,1.4,.5,1),height .28s cubic-bezier(.3,1.4,.5,1),border-radius .28s,transform .2s cubic-bezier(.3,1.4,.5,1),background-color .2s}
.rb-portfolio .rb-cdot.clickable{width:58px;height:34px;border-radius:10px;background:var(--cur-clk)}
.rb-portfolio .rb-cdot.down{transform:translate(-50%,-50%) scale(.84)}
.rb-portfolio .rb-cdot span{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--cur-fg);white-space:nowrap;opacity:0;transition:opacity .12s}
.rb-portfolio .rb-cdot.clickable span{opacity:1}

/* Information: scoped styles leave the other tabs untouched. */
.rb-portfolio.tab-1 .rb-main{inset:0;padding:125px 7% 88px;overflow:hidden;align-items:center}
.rb-portfolio.tab-1 .rb-main>section{width:100%;max-width:1180px;margin:0 auto}
.rb-portfolio.tab-1 .rb-top,.rb-portfolio.tab-1 .rb-footer{background:transparent}
.rb-portfolio .rb-about{--about-text:#f1f2f4;--about-muted:#a4a7ae;--about-accent:#a8dcd7;width:100%;color:var(--about-text)}
.rb-portfolio .rb-about-heading{margin-bottom:30px}
.rb-portfolio .rb-about-heading .rb-label{margin:0 0 16px;color:var(--about-muted);font-size:10px;letter-spacing:2px}
.rb-portfolio .rb-about-heading h1{margin:0;font-size:clamp(34px,4.4vw,60px);font-weight:400;line-height:1.08;letter-spacing:-.055em}
.rb-portfolio .rb-about h1 span,.rb-portfolio .rb-about-skills h2 span{color:var(--about-accent)}
.rb-portfolio .rb-about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.rb-portfolio .rb-about-card{min-width:0;padding:28px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(135deg,#20252bdd,#12151be8);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 #ffffff08,0 12px 35px #00000018;transition:transform .3s,border-color .3s,box-shadow .3s}
.rb-portfolio .rb-about-card:hover{transform:translateY(-4px);border-color:#a8dcd755;box-shadow:inset 0 1px 0 #ffffff10,0 16px 40px #00000026,0 0 22px #a8dcd709}
.rb-portfolio .rb-about-eyebrow{margin:0 0 13px;color:var(--about-muted);font-size:10px;letter-spacing:1.8px;font-weight:500}
.rb-portfolio .rb-about-card h2{margin:0 0 24px;font-size:clamp(23px,2.5vw,34px);font-weight:500;letter-spacing:-.04em;line-height:1.15}
.rb-portfolio .rb-about-location,.rb-portfolio .rb-about-contact-row{display:flex;gap:14px;align-items:center}
.rb-portfolio .rb-about-icon{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff12;border-radius:12px;background:#ffffff04;color:var(--about-accent);transition:background .25s,transform .25s}
.rb-portfolio .rb-about-icon svg{width:19px;height:19px}
.rb-portfolio .rb-about-label{display:block;color:var(--about-muted);font-size:9px;letter-spacing:1.5px;margin-bottom:5px}
.rb-portfolio .rb-about-location p{margin:0;font-size:14px;line-height:1.5}
.rb-portfolio .rb-about-contact{margin-top:22px;padding-top:20px;border-top:1px solid #ffffff12;display:grid;gap:16px}
.rb-portfolio .rb-about-contact-row{text-decoration:none;color:var(--about-text);border-radius:12px;transition:color .25s}
.rb-portfolio .rb-about-contact-row>span:last-child{min-width:0}
.rb-portfolio .rb-about-value{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.rb-portfolio .rb-about-contact-row:hover{color:var(--about-accent)}
.rb-portfolio .rb-about-contact-row:hover .rb-about-icon{background:#a8dcd712;transform:translateY(-2px)}
.rb-portfolio .rb-about-contact-row:focus-visible{outline:2px solid var(--about-accent);outline-offset:6px}
.rb-portfolio .rb-about-note{max-width:300px;margin:-10px 0 26px;font-size:14px;line-height:1.65;color:var(--about-muted)}
.rb-portfolio .rb-about-tags{list-style:none;display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0}
.rb-portfolio .rb-about-tags li{padding:10px 14px;border:1px solid #a8dcd72b;border-radius:10px;color:#d5e9e6;background:#a8dcd707;font-size:12px;line-height:1.3;transition:transform .25s,border-color .25s,background .25s}
.rb-portfolio .rb-about-tags li:hover{transform:translateY(-3px);background:#a8dcd714;border-color:#a8dcd766}
@media(max-width:700px){
.rb-portfolio.tab-1 .rb-main{padding:145px 7% 78px}
.rb-portfolio .rb-about-heading{margin-bottom:18px}
.rb-portfolio .rb-about-heading .rb-label{font-size:8px;margin-bottom:10px}
.rb-portfolio .rb-about-grid{grid-template-columns:1fr;gap:12px}
.rb-portfolio .rb-about-card{padding:18px;border-radius:16px}
.rb-portfolio .rb-about-card h2{font-size:23px;margin-bottom:16px}
.rb-portfolio .rb-about-eyebrow{font-size:9px;margin-bottom:8px}
.rb-portfolio .rb-about-contact{margin-top:14px;padding-top:14px;gap:10px}
.rb-portfolio .rb-about-icon{flex-basis:30px;width:30px;height:30px;border-radius:9px}
.rb-portfolio .rb-about-value,.rb-portfolio .rb-about-location p{font-size:12px}
.rb-portfolio .rb-about-note{display:none}
.rb-portfolio .rb-about-tags{gap:7px}
.rb-portfolio .rb-about-tags li{font-size:10px;padding:7px 10px}
}
@media(max-height:760px) and (min-width:701px){.rb-portfolio .rb-about-heading{margin-bottom:20px}.rb-portfolio .rb-about-card{padding:22px}.rb-portfolio .rb-about-heading h1{font-size:42px}}
@media(prefers-reduced-motion:reduce){.rb-portfolio .rb-about-card,.rb-portfolio .rb-about-icon,.rb-portfolio .rb-about-tags li{transition:none;transform:none!important}}

/* Expanded Developer Profile */
.rb-portfolio .rb-about-heading{margin-bottom:22px}
.rb-portfolio .rb-about-heading h1{font-size:clamp(32px,4vw,52px)}
.rb-portfolio .rb-about-grid{grid-template-columns:1fr 1.25fr;gap:18px}
.rb-portfolio .rb-about-card{padding:22px}
.rb-portfolio .rb-about-card h2{font-size:28px;margin-bottom:18px}
.rb-portfolio .rb-profile-nationality{margin-top:16px}
.rb-portfolio .rb-profile-nationality p{margin:0;font-size:13px;line-height:1.5}
.rb-portfolio .rb-about-contact{margin-top:16px;padding-top:16px;gap:12px}
.rb-portfolio .rb-profile-group+.rb-profile-group{margin-top:18px;padding-top:16px;border-top:1px solid #ffffff12}
.rb-portfolio .rb-profile-group h3,.rb-portfolio .rb-profile-extra h3{margin:0 0 9px;font-weight:500;font-size:12px;color:var(--about-text)}
.rb-portfolio .rb-about-tags{gap:7px}
.rb-portfolio .rb-about-tags li{padding:7px 10px;font-size:11px}
.rb-portfolio .rb-profile-caption{margin:9px 0 0;font-size:11px;line-height:1.5;color:var(--about-muted)}
.rb-portfolio .rb-profile-extra{border-top:1px solid #ffffff12;margin-top:18px;padding-top:16px}
.rb-portfolio .rb-profile-extra p{margin:0 0 14px;font-size:12px;line-height:1.5;color:var(--about-muted)}
.rb-portfolio .rb-profile-extra p:last-child{margin-bottom:0}
@media(max-width:700px){
.rb-portfolio .rb-about-grid{grid-template-columns:1fr 1.15fr;gap:8px}
.rb-portfolio.tab-1 .rb-main{padding:140px 4% 75px}
.rb-portfolio .rb-about-card{padding:12px;border-radius:14px}
.rb-portfolio .rb-about-card h2{font-size:19px;margin-bottom:12px}
.rb-portfolio .rb-about-location,.rb-portfolio .rb-about-contact-row{gap:6px}
.rb-portfolio .rb-about-icon{display:none}
.rb-portfolio .rb-about-value,.rb-portfolio .rb-about-location p,.rb-portfolio .rb-profile-nationality p{font-size:10px}
.rb-portfolio .rb-profile-group h3,.rb-portfolio .rb-profile-extra h3{font-size:10px}
.rb-portfolio .rb-profile-extra p,.rb-portfolio .rb-profile-caption{font-size:9px}
.rb-portfolio .rb-profile-group+.rb-profile-group{margin-top:12px;padding-top:10px}
.rb-portfolio .rb-about-tags li{padding:5px 6px;font-size:9px}
.rb-portfolio .rb-about-tags{gap:5px}
.rb-portfolio .rb-about-heading{margin-bottom:16px}
}


/* Wider robot speech with gently extended lettering. */
.rb-portfolio .rb-fact-bubble{width:min(460px,calc(100vw - 150px));box-sizing:border-box}
.rb-portfolio .rb-fact-bubble p{width:90.9%;transform:scaleX(1.1);transform-origin:left center;overflow-wrap:break-word}
@media(max-width:700px){.rb-portfolio .rb-fact-bubble{width:min(320px,calc(100vw - 125px))!important}}

</style>

      var el = introHost.firstElementChild;
      if (el) {
        var a = el.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.1)" }], { duration: 700, easing: "ease-in-out", fill: "forwards" });
        a.onfinish = function () { if (!S.intro) introHost.innerHTML = ""; };
      }
    }
  }

  /* ---------- atmosphere canvas (ported 1:1) ---------- */
  function initAtmosphere() {
    var el = root.querySelector(".rb-canvas");
    var ctx = el.getContext("2d");
    if (!ctx) return;
    var w = 1, h = 1, frame = 0, time = 0, previous = 0, lastPaint = 0;
    var mouse = { x: 0.72, y: 0.4 };
    var trail = [];
    function resize() {
      var r = el.getBoundingClientRect();
      var nextW = Math.max(1, r.width), nextH = Math.max(1, r.height);
      if (nextW === w && nextH === h) return;
      w = nextW; h = nextH;
      var d = Math.min(window.devicePixelRatio || 1, 1.25);
      el.width = Math.round(w * d);
      el.height = Math.round(h * d);
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    new ResizeObserver(resize).observe(el);
    resize();
    var points = Array.from({ length: 65 }, function (_, i) {
      return { x: ((i * 73.13) % 997) / 997, y: ((i * 137.71) % 991) / 991, phase: i * 1.7 };
    });
    function draw(stamp) {
      frame = requestAnimationFrame(draw);
      if (document.hidden) { previous = 0; return; }
      if (stamp - lastPaint < 1000 / 30) return;
      lastPaint = stamp;
      var dt = Math.min((stamp - previous) / 1000 || 0.016, 0.04);
      previous = stamp;
      time += reduced ? 0 : dt;
      var dark = S.dark, tab = S.tab, pointer = S.pointer;
      mouse.x += ((pointer.x + 1) / 2 - mouse.x) * 0.045;
      mouse.y += ((pointer.y + 1) / 2 - mouse.y) * 0.045;
      var mx = mouse.x * w, my = mouse.y * h;
      ctx.clearRect(0, 0, w, h);
      if (!reduced) {
        trail.push({ x: mx, y: my, life: 1 });
        if (trail.length > 35) trail.shift();
        for (var i = 1; i < trail.length; i++) {
          var p = trail[i], prev = trail[i - 1];
          p.life -= dt * 0.8;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = dark
            ? "rgba(218,225,239," + (((Math.max(0, p.life) * i) / trail.length) * 0.2) + ")"
            : "rgba(55,65,82," + (((Math.max(0, p.life) * i) / trail.length) * 0.16) + ")";
          ctx.lineWidth = (i / trail.length) * 1.6;
          ctx.stroke();
        }
      }
      var glow = ctx.createRadialGradient(mx, my, 0, mx, my, w * 0.5);
      glow.addColorStop(0, dark ? "rgba(180,186,196,.085)" : "rgba(58,69,89,.13)");
      glow.addColorStop(1, "rgba(180,186,196,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
      for (var j = 0; j < 18; j++) {
        ctx.beginPath();
        for (var k = 0; k <= 60; k++) {
          var x = w * (0.32 + (k / 60) * 0.87);
          var base = h * (0.12 + j * 0.032);
          var wave = Math.sin(k * 0.06375 + time * 0.24 + tab * 0.6) * h * 0.12;
          var dist = (x - mx) / Math.max(w * 0.22, 1);
          var pull = Math.exp(-dist * dist) * (my - h * 0.5) * 0.3;
          var y = base + wave + Math.sin(k * 0.1275 + j * 0.13 + time * 0.18) * 25 + pull;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = dark ? "rgba(174,181,193," + (0.025 + j * 0.0025) + ")" : "rgba(46,55,70," + (0.09 + j * 0.003) + ")";
        ctx.lineWidth = j % 6 === 0 ? 1.1 : 0.55;
        ctx.stroke();
      }
      var locations = points.map(function (p) {
        var x = p.x * w + Math.sin(time * 0.16 + p.phase) * 18,
            y = p.y * h + Math.cos(time * 0.2 + p.phase) * 18;
        var dx = x - mx, dy = y - my, d = Math.sqrt(dx * dx + dy * dy), influence = Math.max(0, 1 - d / 180);
        if (!reduced) { x += dx * influence * 0.18; y += dy * influence * 0.18; }
        return { x: x, y: y, influence: influence };
      });
      for (var a = 0; a < locations.length; a++) {
        var P = locations[a];
        if (P.influence > 0.05) {
          for (var b = a + 1; b < locations.length; b++) {
            var Q = locations[b], dd = Math.hypot(P.x - Q.x, P.y - Q.y);
            if (dd < 130) {
              ctx.beginPath();
              ctx.moveTo(P.x, P.y);
              ctx.lineTo(Q.x, Q.y);
              ctx.strokeStyle = dark
                ? "rgba(180,186,196," + ((1 - dd / 130) * P.influence * 0.32) + ")"
                : "rgba(40,52,72," + ((1 - dd / 130) * P.influence * 0.5) + ")";
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        ctx.beginPath();
        ctx.arc(P.x, P.y, 0.7 + P.influence * 1.7, 0, Math.PI * 2);
        ctx.fillStyle = P.influence > 0.15
          ? (dark ? "rgba(205,212,223," + (0.3 + P.influence * 0.6) + ")" : "rgba(40,50,66," + (0.4 + P.influence * 0.5) + ")")
          : (dark ? "rgba(206,211,220,.22)" : "rgba(52,57,66,.2)");
        ctx.fill();
      }
    }
    frame = requestAnimationFrame(draw);
  }

  /* ---------- boot ---------- */
  renderRobotSlots();
  setFactText(false);
  sync();
  renderSection();
  initAtmosphere();

  var played = false;
  try {
    played = sessionStorage.getItem("rb-intro-v2") === "played";
    sessionStorage.setItem("rb-intro-v2", "played");
  } catch (e) {}
  if (!played) { setIntro(true); setTimeout(function () { setIntro(false); }, 2800); }

  if (facts.length) {
    setInterval(function () {
      if (document.hidden || S.intro) return;
      S.factIndex = (S.factIndex + 1) % facts.length;
      S.fact = true;
      setFactText(true);
    }, 15000);
  }
})();
</script>
</body>
